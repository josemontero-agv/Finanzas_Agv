version: '3.8'

services:
  # Backend Flask (único servicio necesario para tu despliegue actual)
  backend:
    build: .
    command: sh -c "gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 180 run:app"
    ports:
      - "5000:5000"
    env_file:
      - .env.produccion
    environment:
      - APP_ENV=production
    restart: unless-stopped

  # Frontend opcional para desarrollo local
  # Ejecutar con: docker compose --profile frontend up
  frontend:
    image: node:20-alpine
    profiles: ["frontend"]
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_FLASK_API_URL=http://localhost:5000
    depends_on:
      - backend

