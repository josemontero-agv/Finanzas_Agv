version: '3.8'

services:
  # Redis: broker/backend de Celery y storage de Flask-Caching / Flask-Limiter en producción.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Flask
  backend:
    build: .
    command: sh -c "gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 4 --timeout 180 run:app"
    ports:
      - "5000:5000"
    env_file:
      - .env.produccion
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - LETTERS_MODULE_ENABLED=false
      # Cobranzas: odoo (default local) o supabase (probar stack ETL + lectura Postgres).
      - COLLECTIONS_SOURCE=${COLLECTIONS_SOURCE:-odoo}
    depends_on:
      - redis
    restart: unless-stopped

  # Worker de Celery: ejecuta las tareas asíncronas (p.ej. run_etl_sync).
  worker:
    build: .
    command: sh -c "celery -A celery_worker.celery worker -l info"
    env_file:
      - .env.produccion
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # Beat de Celery: programa periódicamente la tarea run_etl_sync (ver ETL_SYNC_MINUTES).
  beat:
    build: .
    command: sh -c "celery -A celery_worker.celery beat -l info"
    env_file:
      - .env.produccion
    environment:
      - APP_ENV=production
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  # Frontend opcional para desarrollo local
  # Ejecutar con: docker compose --profile frontend up
  frontend:
    image: node:20-alpine
    profiles: ["frontend"]
    working_dir: /app
    command: sh -c "yarn install --frozen-lockfile && yarn dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_FLASK_API_URL=http://localhost:5000
      - NEXT_PUBLIC_ENABLE_LETTERS=false
      - NEXT_PUBLIC_ENABLE_LETTERS=false
    depends_on:
      - backend

volumes:
  redis_data:

