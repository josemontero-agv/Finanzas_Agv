# =============================================================================
# Render Blueprint - Finanzas AGV
# =============================================================================
# Referencia: https://render.com/docs/blueprint-spec
#
# Uso: Render > New > Blueprint, apuntando a este repositorio. Las variables con
# `sync: false` deben cargarse manualmente en el dashboard de Render (nunca en el repo).
# Ver auditoria/Informe_Entrega_V2/GUIA_DESPLIEGUE_RENDER.md para la checklist completa.
#
# Arquitectura (Fase 3/4 - piloto Cobranzas): 3 servicios, sin worker persistente de
# Celery ni Redis administrado en producción. El ETL (Odoo -> Supabase) corre como Cron
# Job independiente cada 15 min en vez de Celery Beat. COLLECTIONS_SOURCE=odoo es el
# default seguro hasta lograr paridad 3/3 (workflow parity.yml); cambiar a supabase
# manualmente en el dashboard de Render tras validar paridad.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend Flask (API REST) - Cobranzas desde Odoo (default seguro hasta paridad 3/3)
  # ---------------------------------------------------------------------------
  - type: web
    name: finanzas-agv-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: COLLECTIONS_SOURCE
        value: odoo
      - key: LETTERS_MODULE_ENABLED
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USER
        sync: false
      - key: ODOO_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Lista blanca equipo Créditos/Cobranzas (6 correos @agrovetmarket.com, comma-separated):
      # kattya.barcena, jancarlo.pariasca, eigly.pereira, augusto.matto, jhosselyn.paliza, maria.alvarez
      - key: ALLOWED_USERS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_DB_URI
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: MAIL_DEFAULT_CC
        sync: false
      - key: MAIL_DEFAULT_BCC
        sync: false
      - key: DEV_EMAIL_MODE
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---------------------------------------------------------------------------
  # Frontend Next.js
  # ---------------------------------------------------------------------------
  - type: web
    name: finanzas-agv-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    envVars:
      - key: NEXT_PUBLIC_FLASK_API_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_ENABLE_LETTERS
        value: "false"

  # ---------------------------------------------------------------------------
  # Cron Job ETL Odoo -> Supabase (cada 15 min). Reemplaza al worker de Celery
  # con Beat embebido que existía antes en producción (ver nota de arquitectura
  # arriba). Usa el mismo Dockerfile/imagen que el backend.
  # ---------------------------------------------------------------------------
  - type: cron
    name: finanzas-agv-etl
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "*/15 * * * *"
    dockerCommand: python -m scripts.etl.etl_sync_threading
    envVars:
      - key: APP_ENV
        value: production
      - key: ODOO_URL
        sync: false
      - key: ODOO_DB
        sync: false
      - key: ODOO_USER
        sync: false
      - key: ODOO_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
